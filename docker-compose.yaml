services:
  db:
    image: postgres:14
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: trickal_bug_tracker # creates db with this name
    ports:
      - 5433:5432 # default pg listens on port 5432 so map container to port 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
  
  server:
    build:
      context: . # set . as root to copy shared files                        
      dockerfile: apps/server/Dockerfile
    env_file:
      - apps/server/.env.docker
    environment:
      DATABASE_URL: postgresql://postgres:secret@db:5432/trickal_bug_tracker
    ports:
      - "3000:3000"
    depends_on:
      - db
  
volumes:
  pgdata:
      