services:
  db:
    image: postgres:14
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: trickal_bug_tracker # creates db with this name
    ports:
      - 5433:5432 # default pg listens on port 5432. Map 5432(container) to port 5433 (host)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trickal_bug_tracker"]
      interval: 5s
      timeout: 3s
      retries: 5
  
  redis:
    image: redis:7-alpine
    ports:
     - '6380:6379' # default redis listens on port 6379. Map 6379(container) to port 6380 (host)
    command: redis-server
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: . # set . as root to copy shared files                        
      dockerfile: apps/server/dockerfile
    env_file:
      - apps/server/.env.docker
    environment:
      DATABASE_URL: postgresql://postgres:secret@db:5432/trickal_bug_tracker
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: apps/client/dockerfile
      # args:
        # VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    # depends_on:
      # - server
  
volumes:
  pgdata:
      