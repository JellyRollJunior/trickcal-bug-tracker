services:
  db:
    image: postgres:14
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: trickal_bug_tracker # creates db with this name
    ports:
      - 5433:5432 # default pg listens on port 5432 so map container to port 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
  
volumes:
  pgdata:
      