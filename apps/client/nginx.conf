server {
    listen 5173; # accept connections on this port
    root /usr/share/nginx/html; # set base directory on container that Nginx serves files from
    index index.html; # default file to serve when a directory is requested

    # location block matches requests based on URL path
    # location /: matches every request that starts with / (so all requests)
    location / {
        # try serving file at URI, then URI/, then fallback to serving /index.html
        try_files $uri $uri/ /index.html;
    }
}